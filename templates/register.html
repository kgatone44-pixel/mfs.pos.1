<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဆိုင်အကောင့်သစ် ဖွင့်ရန် (Register)</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #38bdf8;
            --btn-bg: #10b981;
            --btn-hover: #059669;
        }

        body.light-mode {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --btn-bg: #10b981;
            --btn-hover: #059669;
        }

        body {
            font-family: 'Pyidaungsu', 'Padauk', 'Myanmar Text', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .top-controls select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .register-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 20px; 
            color: var(--primary); 
            font-size: 22px;
        }
        .form-group { 
            margin-bottom: 15px; 
            text-align: left;
        }
        label { 
            display: block; 
            font-size: 13px; 
            color: var(--text-muted); 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--primary); }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-register:hover { background: var(--btn-hover); }
        .error-msg { background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; color: var(--text-muted); }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="top-controls">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="my">🇲🇲 မြန်မာ</option>
            <option value="en">🇬🇧 English</option>
        </select>
        <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="dark">🌙 Dark</option>
            <option value="light">☀️ Light</option>
        </select>
    </div>

    <div class="register-card">
        <h2 id="pageTitle">🏬 ဆိုင်အကောင့်သစ် ဖွင့်ရန်</h2>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label id="lblShopName">ဆိုင်အမည် (Shop Name)</label>
                <input type="text" name="shop_name" id="inputShopName" placeholder="ဥပမာ - ရွှေပြည်အေး ငွေလွှဲဆိုင်" required>
            </div>
            <div class="form-group">
                <label id="lblUsername">အသုံးပြုမည့် Username</label>
                <input type="text" name="username" id="inputUsername" placeholder="Username ထည့်ပါ" required>
            </div>
            <div class="form-group">
                <label id="lblPassword">စကားဝှက် (Password)</label>
                <input type="password" name="password" id="inputPassword" placeholder="Password ထည့်ပါ" required>
            </div>
            <button type="submit" class="btn-register" id="btnRegister">အကောင့်အတည်ပြုမည်</button>
        </form>
        <div class="login-link">
            <span id="txtHasAccount">အကောင့်ရှိပြီးသားလား?</span> <a href="/login" id="lnkLogin">ဝင်ရောက်ရန် (Login)</a>
        </div>
    </div>

    <script>
        const translations = {
            my: {
                pageTitle: "🏬 ဆိုင်အကောင့်သစ် ဖွင့်ရန်",
                lblShopName: "ဆိုင်အမည် (Shop Name)",
                inputShopName: "ဥပမာ - ရွှေပြည်အေး ငွေလွှဲဆိုင်",
                lblUsername: "အသုံးပြုမည့် Username",
                inputUsername: "Username ထည့်ပါ",
                lblPassword: "စကားဝှက် (Password)",
                inputPassword: "Password ထည့်ပါ",
                btnRegister: "အကောင့်အတည်ပြုမည်",
                txtHasAccount: "အကောင့်ရှိပြီးသားလား?",
                lnkLogin: "ဝင်ရောက်ရန် (Login)"
            },
            en: {
                pageTitle: "🏬 Create Shop Account",
                lblShopName: "Shop Name",
                inputShopName: "e.g. Shwe Pyi Aye MFS",
                lblUsername: "Username",
                inputUsername: "Enter username",
                lblPassword: "Password",
                inputPassword: "Enter password",
                btnRegister: "Register Account",
                txtHasAccount: "Already have an account?",
                lnkLogin: "Login"
            }
        };

        function applyLanguage(lang) {
            const t = translations[lang];
            if(t) {
                document.getElementById('pageTitle').innerText = t.pageTitle;
                document.getElementById('lblShopName').innerText = t.lblShopName;
                document.getElementById('inputShopName').placeholder = t.inputShopName;
                document.getElementById('lblUsername').innerText = t.lblUsername;
                document.getElementById('inputUsername').placeholder = t.inputUsername;
                document.getElementById('lblPassword').innerText = t.lblPassword;
                document.getElementById('inputPassword').placeholder = t.inputPassword;
                document.getElementById('btnRegister').innerText = t.btnRegister;
                document.getElementById('txtHasAccount').innerText = t.txtHasAccount;
                document.getElementById('lnkLogin').innerText = t.lnkLogin;
            }
        }

        function changeLanguage(lang) {
            localStorage.setItem('pos_lang', lang);
            applyLanguage(lang);
        }

        function changeTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                localStorage.setItem('pos_theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('pos_theme', 'dark');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('pos_theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeSelect').value = 'light';
            } else {
                document.getElementById('themeSelect').value = 'dark';
            }

            const savedLang = localStorage.getItem('pos_lang') || 'my';
            document.getElementById('languageSelect').value = savedLang;
            applyLanguage(savedLang);
        };
    </script>
</body>
</html>
