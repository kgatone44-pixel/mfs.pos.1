<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFS POS - Login</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #38bdf8;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
        }

        body.light-mode {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
        }

        body {
            font-family: 'Pyidaungsu', 'Padauk', 'Myanmar Text', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .top-controls select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .login-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            background: var(--btn-bg);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px auto;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: var(--text-main);
        }
        p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: var(--btn-hover);
        }
        .register-link {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fee2e2;
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="my">🇲🇲 မြန်မာ</option>
            <option value="en">🇬🇧 English</option>
        </select>
        <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="dark">🌙 Dark</option>
            <option value="light">☀️ Light</option>
        </select>
    </div>

    <div class="login-card">
        <div class="logo-icon">💵</div>
        <h1 id="pageTitle">MFS POS Express</h1>
        <p id="pageSubtitle">ငွေလွှဲ/ငွေထုတ် စာရင်းကိုင် စနစ်</p>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label id="lblUsername">Username (အကောင့်အမည်)</label>
                <input type="text" name="username" id="inputUsername" placeholder="အကောင့်အမည် ရိုက်ပါ" required>
            </div>
            <div class="form-group">
                <label id="lblPassword">Password (စကားဝှက်)</label>
                <input type="password" name="password" id="inputPassword" placeholder="စကားဝှက် ရိုက်ပါ" required>
            </div>
            <button type="submit" id="btnLogin">အကောင့်သို့ ဝင်ရောက်မည်</button>
        </form>
        
        <div class="register-link">
            <span id="txtNoAccount">ဆိုင်အကောင့် မရှိသေးဘူးလား?</span> <a href="/register" id="lnkRegister">အကောင့်သစ်ဖွင့်ရန် (Register)</a>
        </div>

        <div class="footer-text">Prime Dock MFS Solution v2.0</div>
    </div>

    <script>
        const translations = {
            my: {
                pageSubtitle: "ငွေလွှဲ/ငွေထုတ် စာရင်းကိုင် စနစ်",
                lblUsername: "Username (အကောင့်အမည်)",
                inputUsername: "အကောင့်အမည် ရိုက်ပါ",
                lblPassword: "Password (စကားဝှက်)",
                inputPassword: "စကားဝှက် ရိုက်ပါ",
                btnLogin: "အကောင့်သို့ ဝင်ရောက်မည်",
                txtNoAccount: "ဆိုင်အကောင့် မရှိသေးဘူးလား?",
                lnkRegister: "အကောင့်သစ်ဖွင့်ရန် (Register)"
            },
            en: {
                pageSubtitle: "MFS Agent Management System",
                lblUsername: "Username",
                inputUsername: "Enter username",
                lblPassword: "Password",
                inputPassword: "Enter password",
                btnLogin: "Login",
                txtNoAccount: "Don't have a shop account?",
                lnkRegister: "Register Now"
            }
        };

        function applyLanguage(lang) {
            const t = translations[lang];
            if(t) {
                document.getElementById('pageSubtitle').innerText = t.pageSubtitle;
                document.getElementById('lblUsername').innerText = t.lblUsername;
                document.getElementById('inputUsername').placeholder = t.inputUsername;
                document.getElementById('lblPassword').innerText = t.lblPassword;
                document.getElementById('inputPassword').placeholder = t.inputPassword;
                document.getElementById('btnLogin').innerText = t.btnLogin;
                document.getElementById('txtNoAccount').innerText = t.txtNoAccount;
                document.getElementById('lnkRegister').innerText = t.lnkRegister;
            }
        }

        function changeLanguage(lang) {
            localStorage.setItem('pos_lang', lang);
            applyLanguage(lang);
        }

        function changeTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                localStorage.setItem('pos_theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('pos_theme', 'dark');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('pos_theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeSelect').value = 'light';
            } else {
                document.getElementById('themeSelect').value = 'dark';
            }

            const savedLang = localStorage.getItem('pos_lang') || 'my';
            document.getElementById('languageSelect').value = savedLang;
            applyLanguage(savedLang);
        };
    </script>
</body>
</html>
